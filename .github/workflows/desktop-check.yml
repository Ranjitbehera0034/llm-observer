name: Desktop check

# Builds what the desktop app is made of and boots it as far as a headless Linux runner
# can: the Tauri prerequisites, the Node sidecar bundle, the Rust crate (cargo check and
# its unit tests) and the dashboard-to-sidecar contract (absolute loopback API URL, Host/
# Origin guard and CORS for the Tauri origins). It does NOT launch the Tauri window and
# says nothing about macOS or Windows; see docs/guide/desktop.md for what is verified.
on:
  push:
    branches: [ main, develop, 'release/**' ]
    paths:
      - 'packages/desktop/**'
      - 'packages/proxy/scripts/build-sidecar.js'
      - 'packages/proxy/scripts/sidecar-parent-watch.js'
      - 'packages/proxy/src/security/localGuard.ts'
      - 'packages/dashboard/src/config.ts'
      - 'packages/dashboard/src/apiBase.ts'
      - 'tests/integration/desktop*.test.ts'
      - 'packages/proxy/src/__tests__/unit/desktopOrigins.test.ts'
      - '.github/workflows/desktop-check.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'packages/desktop/**'
      - 'packages/proxy/scripts/build-sidecar.js'
      - 'packages/proxy/scripts/sidecar-parent-watch.js'
      - 'packages/proxy/src/security/localGuard.ts'
      - 'packages/dashboard/src/config.ts'
      - 'packages/dashboard/src/apiBase.ts'
      - 'tests/integration/desktop*.test.ts'
      - 'packages/proxy/src/__tests__/unit/desktopOrigins.test.ts'
      - '.github/workflows/desktop-check.yml'

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm

    - name: Install Rust-stable
      uses: dtolnay/rust-toolchain@stable

    # The Tauri v2 Linux prerequisites (webkit2gtk 4.1 and friends).
    - name: Install Tauri system libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev patchelf build-essential pkg-config

    - name: Install dependencies
      run: npm ci

    # tauri.conf.json's frontendDist is packages/dashboard/dist, and the sidecar
    # script refuses to run without the dashboard copied next to the server.
    - name: Build database and dashboard
      run: |
        npm run build --workspace=@llm-observer/database
        npm run build --workspace=@llm-observer/dashboard

    - name: Build the sidecar bundle
      run: npm run build:sidecar --workspace=@llm-observer/proxy

    # Starts the staged sidecar the way lib.rs does and checks /health, the API,
    # the bundled dashboard and the tauri://localhost CORS answer.
    - name: Boot the sidecar bundle
      run: node packages/desktop/scripts/check-sidecar.cjs

    - name: Dashboard and guard tests for the desktop webview
      run: |
        npx vitest run tests/integration/desktopApiBase.test.ts tests/integration/desktopSidecarParentWatch.test.ts tests/integration/desktopWebview.test.ts
        npm exec --workspace=@llm-observer/proxy -- jest --forceExit src/__tests__/unit/desktopOrigins.test.ts src/__tests__/unit/localGuard.test.ts

    - name: cargo check
      working-directory: packages/desktop/src-tauri
      run: cargo check --locked

    - name: cargo test
      working-directory: packages/desktop/src-tauri
      run: cargo test --locked --lib
