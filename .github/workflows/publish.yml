name: Publish Package to npmjs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (for re-running after a fix, without cutting a new release)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      # OIDC trusted publishing (npm publish --provenance, no NPM_TOKEN) needs
      # npm >= 11.5.0, and `npm install -g npm@latest` below now pulls npm 12,
      # which itself requires Node ^22.22.2 || ^24.15.0 || >=26 -- Node 20
      # satisfies neither the trusted-publishing floor nor npm 12's own floor.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - run: npm install -g npm@latest && npm --version

      - run: npm install
      # Not `npm run build --workspaces --if-present`: that has no
      # dependency ordering, and packages/cli's build copies
      # packages/proxy/dist/server.js -- it needs proxy built first.
      # build:ci is the already-correctly-ordered variant (and skips the
      # desktop Tauri build, irrelevant for an npm publish).
      - run: npm run build:ci

      - name: Checksum the package that will be published
        working-directory: packages/cli
        run: |
          npm pack
          sha256sum llm-observer-*.tgz > CHECKSUMS.txt
          cat CHECKSUMS.txt

      - name: Attach checksum to the GitHub release
        working-directory: packages/cli
        run: gh release upload "${{ env.RELEASE_TAG }}" CHECKSUMS.txt --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm publish --provenance
        working-directory: packages/cli
