name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:ci
      - run: npm run build --workspace=@llm-observer/license-server
      - run: npm test
      - run: npm run test:unit
      - name: Verify release versions
        run: node scripts/check-release.cjs

  release:
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run build --workspace=@llm-observer/database
      - run: npm run build --workspace=@llm-observer/dashboard
      - name: Build Proxy
        run: npm run build --workspace=@llm-observer/proxy
        env:
          LICENSE_SERVER_URL: ${{ vars.LICENSE_SERVER_URL }}
      - run: npm run build:sidecar --workspace=@llm-observer/proxy
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "LLM Observer v__VERSION__"
          releaseBody: "See docs/release-2.1.0.md for validation results and beta limitations."
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          workdir: packages/desktop
