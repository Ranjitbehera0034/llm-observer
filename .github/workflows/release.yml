name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  # Installers are built from the tagged commit only if it typechecks and its
  # tests pass.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build:ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run test:unit

  release:
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust-stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          
      - name: Install project dependencies
        run: npm ci

      - name: Build Dashboard
        run: npm run build --workspace=@llm-observer/dashboard

      - name: Build Proxy
        run: npm run build --workspace=@llm-observer/proxy

      - name: Build proxy sidecar for Tauri
        run: npm run build:sidecar --workspace=@llm-observer/proxy

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__ # tauri-action replaces this with the app version
          releaseName: "LLM Observer v__VERSION__"
          releaseBody: "See the assets below to install."
          releaseDraft: true
          prerelease: false
          workdir: packages/desktop
