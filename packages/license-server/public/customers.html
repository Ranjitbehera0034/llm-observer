<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LLM Observer · Customers</title>
<style>body{font:16px system-ui;background:#101522;color:#e7ecf6;max-width:1200px;margin:40px auto;padding:20px}input,button{font:inherit;padding:10px;margin:5px;border-radius:6px}table{width:100%;border-collapse:collapse;margin:24px 0}td,th{text-align:left;padding:12px;border-bottom:1px solid #35405a}p{line-height:1.6;color:#bac6dc}#notice{color:#f5c969}.scroll{overflow:auto}</style>
<h1>Customers and reported activity</h1><p>Billing status is a snapshot from payment events. Last seen means the application reported running; it does not prove active use. Free installations are anonymous. Customers who decline reporting have unknown activity.</p>
<form id="login"><label>Admin token <input id="token" type="password" autocomplete="off" required></label><button>Load customers</button></form><button id="demo">Show isolated demo customers</button><button id="next" hidden>Next page</button><p id="notice" role="status"></p><div id="report" class="scroll"></div>
<script>
const $=id=>document.getElementById(id);let offset=0;let next=null;
function table(title, columns, rows){const heading=document.createElement('h2');heading.textContent=title;const t=document.createElement('table');const tr=document.createElement('tr');columns.forEach(c=>{const th=document.createElement('th');th.textContent=c;tr.append(th)});t.append(tr);rows.forEach(row=>{const r=document.createElement('tr');row.forEach(v=>{const cell=document.createElement('td');cell.textContent=v??'Unknown';r.append(cell)});t.append(r)});$('report').append(heading,t)}
function render(data){$('report').replaceChildren();table('Billing records',['Customer reference','Email','Status','Access until','Environment','Verified at'],data.customers.map(c=>[c.id,c.email,c.status,c.valid_until,c.test_mode?'TEST':'Live',c.updated_at]));table('Opt-in installations',['Installation','Customer reference','Plan snapshot','Access until','Version','Last seen'],data.installations.map(i=>[i.id,i.customer_ref,i.plan,i.valid_until,i.version,i.last_seen]));next=data.next_offset;$('next').hidden=next==null;}
async function load(){try{$('notice').textContent='Loading…';const r=await fetch('/admin/customers?offset='+offset,{headers:{Authorization:'Bearer '+$('token').value},cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error);render(d);$('notice').textContent=d.coverage;}catch(e){$('notice').textContent=e.message;}}
$('login').onsubmit=e=>{e.preventDefault();offset=0;load()};$('next').onclick=()=>{offset=next;load()};
$('demo').onclick=()=>{render({customers:[{id:'demo:pro',email:'premium@example.invalid',status:'active',valid_until:'2030-01-01',test_mode:true,updated_at:'2026-11-14'},{id:'demo:trial',email:'trial@example.invalid',status:'on_trial',valid_until:'2026-11-21',test_mode:true,updated_at:'2026-11-14'}],installations:[{id:'DEMO free installation',customer_ref:null,plan:'free',version:'demo',last_seen:'2026-11-14'},{id:'DEMO premium installation',customer_ref:'demo:pro',plan:'pro',version:'demo',last_seen:'2026-11-14'},{id:'DEMO trial installation',customer_ref:'demo:trial',plan:'trial',version:'demo',last_seen:'2026-11-14'}],next_offset:null});$('notice').textContent='DEMO ONLY — synthetic records in this browser. No accounts, payment, email, licenses, or database records were created.'};
</script></html>
